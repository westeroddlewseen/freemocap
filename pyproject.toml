[build-system]
requires = ["flit_core >=3.2.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "freemocap"
dynamic = ["version", "description"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "FreeMoCap Team", email = "info@freemocap.org" }
]
keywords = ["motion capture", "pose estimation", "computer vision", "biomechanics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23.0",
    "opencv-contrib-python>=4.8.0",
    "mediapipe>=0.10.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "pandas>=1.5.0",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
    "toml>=0.10.2",
    "tomlkit>=0.11.0",
    "pyqt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "skelly_synchronize>=0.2.0",
    "skellytracker>=0.1.0",
    "aniposelib>=0.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://freemocap.org"
Documentation = "https://freemocap.readthedocs.io"
Repository = "https://github.com/freemocap/freemocap"
"Bug Tracker" = "https://github.com/freemocap/freemocap/issues"

[project.scripts]
freemocap = "freemocap.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Removed --cov flags so tests run faster during local development without coverage overhead
# -p no:warnings added to suppress noisy deprecation warnings while exploring the codebase
addopts = "-v -p no:warnings"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
